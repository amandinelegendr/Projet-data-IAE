name: Mise à jour des offres

on:
  schedule:
    - cron: "0 5 * * *" # chaque jour à 5 h UTC
  workflow_dispatch: # lancement manuel depuis l'onglet Actions
  push: # et à chaque modification des scripts
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extraire les offres d'alternance (France Travail)
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python scripts/extraction_offres.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          # La date d'extraction change à chaque passage : on ne commit que si les chiffres ont bougé
          if git diff --cached -U0 docs/data | grep -E '^[+-][^+-]' | grep -qv '"mise_a_jour"'; then
            git commit -m "Offres : mise à jour automatique du $(date +%F)"
            git push
          else
            echo "Aucune nouvelle donnée."
          fi
