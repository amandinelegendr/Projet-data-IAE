<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatoire des alternances en ingénierie</title>
<meta name="description" content="Observatoire et laboratoire statistique des offres d'alternance en ingénierie en France : carte, indicateurs et tests d'hypothèses sur les offres réelles de La bonne alternance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8f9fb; --text: #141b26; --muted: #5b6676; --line: #e1e5eb;
  --accent: #1f5fbf; --accent-soft: #e5eefb; --ok: #1b7f4b; --ok-soft: #e3f4ea; --ko: #b3261e; --ko-soft: #fbe9e7;
  --warn-bg: #fff4d6; --warn-text: #6b4e00;
  --s0: #eef3fb; --s1: #c7d8f2; --s2: #8fb3e6; --s3: #4f86d4; --s4: #1f5fbf; --s5: #123d80;
  --empty: #e9ecf0; --stroke: #ffffff; --sel: #e8710a;
  --cac: #b8860b; --cac-soft: #fbf1d6; --gg: #1f5fbf; --gg-soft: #e5eefb; --pme: #6b7685; --pme-soft: #eef0f3;
  --c1: #1f5fbf; --c2: #e8710a; --c3: #1b7f4b; --c4: #8e44ad; --c5: #c0392b; --c6: #16a0b5;
  --p-prestige: #b8860b; --p-remu: #1f5fbf; --p-mission: #1b7f4b; --p-cadre: #8e44ad;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #181e26; --surface-2: #1d2430; --text: #e6eaf0; --muted: #98a3b2; --line: #2b3440;
    --accent: #7fa9ec; --accent-soft: #22324a; --ok: #5cc98d; --ok-soft: #173326; --ko: #f08a80; --ko-soft: #3b1f1c;
    --warn-bg: #3a3014; --warn-text: #f3d68a;
    --s0: #1e2a3b; --s1: #23406a; --s2: #2c5899; --s3: #4277c6; --s4: #6f9be0; --s5: #a9c6f2;
    --empty: #232a34; --stroke: #0f1318; --sel: #ff9a3d;
    --cac: #e0b84a; --cac-soft: #3a3018; --gg: #7fa9ec; --gg-soft: #22324a; --pme: #a3adbb; --pme-soft: #262d37;
    --c1: #7fa9ec; --c2: #ff9a3d; --c3: #5cc98d; --c4: #c39be0; --c5: #f08a80; --c6: #5fd0e0;
    --p-prestige: #e0b84a; --p-remu: #7fa9ec; --p-mission: #5cc98d; --p-cadre: #c39be0;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e26; --surface-2: #1d2430; --text: #e6eaf0; --muted: #98a3b2; --line: #2b3440;
  --accent: #7fa9ec; --accent-soft: #22324a; --ok: #5cc98d; --ok-soft: #173326; --ko: #f08a80; --ko-soft: #3b1f1c;
  --warn-bg: #3a3014; --warn-text: #f3d68a;
  --s0: #1e2a3b; --s1: #23406a; --s2: #2c5899; --s3: #4277c6; --s4: #6f9be0; --s5: #a9c6f2;
  --empty: #232a34; --stroke: #0f1318; --sel: #ff9a3d;
  --cac: #e0b84a; --cac-soft: #3a3018; --gg: #7fa9ec; --gg-soft: #22324a; --pme: #a3adbb; --pme-soft: #262d37;
  --c1: #7fa9ec; --c2: #ff9a3d; --c3: #5cc98d; --c4: #c39be0; --c5: #f08a80; --c6: #5fd0e0;
  --p-prestige: #e0b84a; --p-remu: #7fa9ec; --p-mission: #5cc98d; --p-cadre: #c39be0;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
a { color: var(--accent); }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; margin: 12px 0; font-size: 13px; }

/* En-tête collant et barre de filtres */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
@media (max-width: 720px) { header.top { position: static; } }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 6px; flex-wrap: wrap; }
.top-row nav { display: flex; gap: 14px; font-size: 13px; }
.top-row nav a { text-decoration: none; color: var(--muted); }
.top-row nav a:hover { color: var(--text); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 0 10px; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 180px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
details.ms { position: relative; }
details.ms > summary { list-style: none; cursor: pointer; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; white-space: nowrap; }
details.ms > summary::-webkit-details-marker { display: none; }
details.ms > summary::after { content: " ▾"; color: var(--muted); }
details.ms[data-actif="true"] > summary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
details.ms .menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 240px; max-height: 320px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
details.ms label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
details.ms label:hover { background: var(--surface-2); }
details.ms .menu .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.slider { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.slider input { width: 110px; accent-color: var(--accent); }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.switch button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 7px 10px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .switch button[aria-pressed="true"] { color: #0d1420; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .switch button[aria-pressed="true"] { color: #0d1420; } }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; }

/* Indicateurs */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
.kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 4px 0; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi .s b { color: var(--text); font-weight: 600; }

/* Carte et panneau */
.explorer { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 960px) { .explorer { grid-template-columns: 1fr; } }
.map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.map-tools select, .lab select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
.map-box { position: relative; }
#map { width: 100%; height: auto; display: block; touch-action: none; }
#map path.zone { stroke: var(--stroke); stroke-width: .6; cursor: pointer; vector-effect: non-scaling-stroke; }
#map path.zone:hover { stroke: var(--text); stroke-width: 1.4; }
#map path.zone.sel { stroke: var(--sel); stroke-width: 2.5; }
#map circle.bulle { fill: var(--c2); fill-opacity: .55; stroke: var(--surface); cursor: pointer; vector-effect: non-scaling-stroke; }
#map circle.bulle:hover, #map circle.bulle.sel { fill-opacity: .9; stroke: var(--text); }
.map-reset { position: absolute; top: 8px; right: 8px; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend .sw { width: 28px; height: 10px; display: inline-block; }
.dom-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dom-strip button { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; color: var(--text); }
.dom-strip button.sel { outline: 2px solid var(--sel); }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 50; max-width: 280px; }

.zone-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.zone-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 12px; }
.zone-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.zone-stats .v { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.delta { font-size: 12px; font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--ko); } .delta.eq { color: var(--muted); }
.list-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.offres { max-height: 760px; overflow: auto; margin: 0 -6px; padding: 0 6px; }
.offre { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); }
.offre .t { font-weight: 600; }
.offre .t a { color: var(--text); text-decoration: none; }
.offre .t a:hover { color: var(--accent); text-decoration: underline; }
.offre .meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.badge { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; line-height: 18px; }
.badge.cac { background: var(--cac-soft); color: var(--cac); }
.badge.gg { background: var(--gg-soft); color: var(--gg); }
.badge.pme { background: var(--pme-soft); color: var(--pme); }
.badge.tt { background: var(--ok-soft); color: var(--ok); }
.badge.neutre { background: var(--surface-2); color: var(--muted); }
.scorebar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--empty); margin-top: 4px; }
.scorebar span { height: 100%; }
.offre .bas { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; }
.offre .score { font-weight: 700; font-size: 15px; }

/* Laboratoire */
section.block { margin: 28px 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.tabs button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .tabs button[aria-selected="true"] { color: #0d1420; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button[aria-selected="true"] { color: #0d1420; } }
.lab-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .lab-grid { grid-template-columns: 1fr; } }
.question { font-size: 15px; font-weight: 600; margin: 4px 0 8px; }
.hyp { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.hyp b { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; }
.controls label { display: flex; gap: 6px; align-items: center; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .axis path, .chart .axis line { stroke: var(--line); }
.chart .grid line { stroke: var(--line); stroke-dasharray: 2 3; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend-inline i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
table.res { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.res th, table.res td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res th { color: var(--muted); font-weight: 600; font-size: 12px; }
.verdict { border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 13px; }
.verdict.rejet { background: var(--ok-soft); border-left: 4px solid var(--ok); }
.verdict.garde { background: var(--surface-2); border-left: 4px solid var(--muted); }
.verdict.limite { background: var(--warn-bg); color: var(--warn-text); border-left: 4px solid var(--warn-text); }
.cours { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 12px; }
.cours h4 { margin: 0 0 4px; font-size: 13px; }
.cours p { margin: 4px 0; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat-grid div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
.stat-grid b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.contingence td { cursor: default; }
.methodo { columns: 2 380px; column-gap: 24px; font-size: 13px; }
.methodo > div { break-inside: avoid; margin-bottom: 14px; }
.methodo h3 { margin-bottom: 4px; }
.methodo ul { margin: 4px 0; padding-left: 18px; }
footer { color: var(--muted); font-size: 12px; padding: 24px 0 40px; border-top: 1px solid var(--line); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>Observatoire &amp; Laboratoire statistique des alternances en ingénierie</h1>
        <div class="muted small" id="sous-titre"></div>
      </div>
      <nav><a href="#explorer">Carte</a><a href="#labo">Laboratoire</a><a href="#methodo">Méthodologie</a></nav>
    </div>
    <div class="filters" id="filtres"></div>
  </div>
</header>

<main class="wrap">
  <div id="alerte" class="banner" hidden></div>
  <div class="kpis" id="kpis"></div>

  <section id="explorer" class="explorer">
    <div class="card">
      <div class="map-tools" id="map-tools"></div>
      <div class="map-box">
        <svg id="map" role="img" aria-label="Carte de France des offres d'alternance en ingénierie"></svg>
        <button class="btn map-reset" id="map-reset" hidden>Toute la France</button>
      </div>
      <div class="legend" id="legende"></div>
      <div class="dom-strip" id="outre-mer"></div>
    </div>
    <div class="card" id="panneau"></div>
  </section>

  <section id="labo" class="block">
    <h2>Laboratoire statistique &amp; tests d'hypothèses</h2>
    <p class="muted" style="margin:0">Chaque test est recalculé en direct sur les offres filtrées en haut de page. Seuil de décision : $\alpha = 5\,\%$.</p>
    <div class="tabs" role="tablist" id="onglets"></div>
    <div class="card" id="module"></div>
  </section>

  <section id="methodo" class="block">
    <h2>Méthodologie et limites</h2>
    <div class="card methodo" id="methodologie"></div>
  </section>
</main>
<footer><div class="wrap" id="pied"></div></footer>
<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
